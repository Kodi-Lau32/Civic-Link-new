<!DOCTYPE html>
<html lang="en">
<head>
  <title>Engineer Form</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/submit.css">
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css' rel='stylesheet' />
  <script defer src='https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js'></script>
  <script defer src="https://api.mapbox.com/search-js/v1.2.0/web.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/nav.js"></script>
  <script defer src="js/projects.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/map.js"></script>
  <script defer src="js/pages/submit.js"></script>
</head>

<body>
<div class="navbar" id="navbar"></div>

<div class="headerbox-form">
    <h1 id="formTitle">Submit Projects</h1>
    <h2 id="formSubtitle">Fill in the fields to submit a project.</h2>
</div>

<!-- Submit form -->
 <div class="submit">

   <form id="projectForm">

    <div class="general-info">
       <h2></h2>
       
       <div class="left-info">
        <h3>Project name</h3>
        <input class="inputs" id="nameid" placeholder="Ex:" required></input>
        <h3>Start date</h3>
        <input class="inputs" type="date" id="range1id" placeholder="Put est start here" required></input>
        <h3>Est. completion date</h3>
      
        <input class="inputs" type="date" id="range2id" placeholder="Put est end here" required></input>

        <h3>Status</h3>
        <select class="inputs" id="statusid">
          <option value="" selected>Automatic (from dates)</option>
          <!-- options are added from PROJECT_STATUSES by js/pages/submit.js -->
        </select>
        <br>
        <!--<input class="inputs" type="date" id="dateid" placeholder="Put date here" required></input> -->
      </div>
    
      <div class="right-info">
        <h3>Project type</h3>
        <select class="inputs" id="typeid" required>
          <option value="" disabled selected>Choose a type...</option>
          <!-- options are added from PROJECT_TYPES by js/pages/submit.js -->
        </select>

        <h3>Description</h3>
        <textarea class="inputs" id="descriptionid" placeholder="Ex: This project's purpose is to..." required></textarea> 
        
        <h3>Address (optional)</h3> 
        <input class="inputs" id="addressid" type="text" autocomplete= "address-line1" placeholder="Ex: 1234 Hollywood Dr."></input>

      </div>
        
    </div>

    <div class="map-selection">
        <h3>Search and select location here</h3>
        <div class="map-selection-container">
          <div id='geocoder-container'></div>
          <div id='map' alt="map loading error."></div> <!--change the id to 'map' to enable the map again, change it to 'map-test' to avoid -->
        </div>
    </div>

        <button type="submit" class="button" id="submitid">Submit</button> 
  </form>
</div>
</body>
</html>
