<!DOCTYPE html>
<html lang="en">
<head>
  <title>Ongoing Projects</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/updates.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/nav.js"></script>
  <script defer src="js/projects.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/project-search.js"></script>
  <script defer src="js/pages/updates.js"></script>
</head>

<body>
  <div class="navbar" id="navbar"></div>

  <!-- Header -->
  <div class="headerbox-updates" style="margin-top:70px;">
    <h2>Project Updates</h2>
    <h4>The latest from your community.</h4>
  </div>

  <!-- Newest projects, newsletter style (added by js/pages/updates.js) -->
  <section class="updates-section">
    <h2 class="section-title">Latest updates</h2>
    <div class="featured-grid" id="featured"></div>
  </section>

  <!-- Full gallery with search -->
  <section class="updates-section" id="allProjects">
    <h2 class="section-title">All projects</h2>
    <div class="updates-search">
      <input type="search" id="projectSearch" class="updates-search-input"
             placeholder="Search projects by name, address, or description..." autocomplete="off">
      <p id="searchStatus" class="updates-search-status"></p>
    </div>
    <div class="projects-container" id="projects"></div>
  </section>
</body>
</html>
