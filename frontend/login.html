<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login Form</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/login.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/nav.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/pages/login.js"></script>
</head>

<body>
<div class="navbar" id="navbar"></div>

<!--  "Submit Projects... If you're a country engineer, login below."  -->
<div class="headerbox-form">
    <h1>Login to Submit Projects</h1>
    <h2>If you're a county engineer, login below.</h2>
</div>

<!-- login form -->
<div class="login">
  <h2>Login Form</h2>
    <form id="loginForm">
        <input type="text" placeholder="Username" class="inputs" id="username" required>
        <input type="password" placeholder="Password" class="inputs" id="password" required>
        <button type="submit" class="button" id="login-button">Login</button>
    </form>

  <p id="message"></p>
  <a href="#" id="forgot-password" >Forgot Password?</a>
</div>
</body>
</html>
