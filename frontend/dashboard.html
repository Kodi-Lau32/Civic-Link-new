<!DOCTYPE html>
<html lang="en">
<head>
  <title>Engineer Dashboard</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/updates.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/nav.js"></script>
  <script defer src="js/projects.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/project-search.js"></script>
  <script defer src="js/pages/dashboard.js"></script>
</head>

<body>
  <div class="navbar" id="navbar"></div>

  <!-- Header -->
  <div class="headerbox-updates" style="margin-top:70px;">
    <h2 id="welcome">Engineer Dashboard</h2>
    <h4>Your contributions to the map.</h4>
  </div>

  <!-- Summary + new project -->
  <div class="dashboard-summary">
    <div class="dashboard-stats" id="stats"></div>
    <a href="submit.html" class="dashboard-new-button">+ Submit a new project</a>
  </div>

  <!-- Search -->
  <div class="updates-search dashboard-search">
    <input type="search" id="projectSearch" class="updates-search-input"
           placeholder="Search your projects..." autocomplete="off">
    <p id="searchStatus" class="updates-search-status"></p>
  </div>

  <!-- Your projects (cards are added by js/pages/dashboard.js) -->
  <div class="projects-container" id="projects"></div>
</body>
</html>
